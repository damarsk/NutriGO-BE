openapi: 3.0.0
info:
  title: NutriGO API
  version: 1.0.0
  description: NutriGO API Documentation

servers:
  - url: http://localhost:3000
    description: Local development server

paths:
  /api/auth/register:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Bad request

  /api/auth/login:
    post:
      summary: Login a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: User logged in successfully
        '400':
          description: Bad request

  /api/auth/me:
    get:
      summary: Get current user information
      responses:
        '200':
          description: User information retrieved successfully
        '401':
          description: Unauthorized