openapi: 3.0.0
info:
  title: NutriGO API
  version: 1.0.0
  description: NutriGO API Documentation

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://api-nutrigo.vercel.app
    description: Production server

tags:
  - name: Auth
  - name: Food
  - name: DailyLog
  - name: Profile

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        201:
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        400:
          description: Bad request or validation error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationErrorResponse"

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        200:
          description: User logged in successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        400:
          description: Bad request or validation error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationErrorResponse"

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user information
      security:
        - bearerAuth: []
      responses:
        200:
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        400:
          description: Failed to fetch user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/foods:
    get:
      tags: [Food]
      summary: Get all foods
      security:
        - bearerAuth: []
      responses:
        200:
          description: Foods retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodListResponse"
        400:
          description: Failed to get foods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags: [Food]
      summary: Create a new food
      description: Admin-only endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodUpsertRequest"
      responses:
        201:
          description: Food created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodResponse"
        400:
          description: Bad request or validation error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationErrorResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/foods/{id}:
    put:
      tags: [Food]
      summary: Update a food by ID
      description: Admin-only endpoint.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FoodUpsertRequest"
      responses:
        200:
          description: Food updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodResponse"
        400:
          description: Bad request or validation error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationErrorResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags: [Food]
      summary: Delete a food by ID
      description: Admin-only endpoint.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Food deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodResponse"
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/dailylogs:
    post:
      tags: [DailyLog]
      summary: Create a daily log entry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDailyLogRequest"
      responses:
        201:
          description: Log created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyLogResponse"
        400:
          description: Bad request or validation error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationErrorResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/dailylogs/{date}:
    get:
      tags: [DailyLog]
      summary: Get daily logs by date
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: path
          required: true
          description: Date in ISO format (YYYY-MM-DD)
          schema:
            type: string
            format: date
      responses:
        200:
          description: Logs retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyLogListResponse"
        400:
          description: Failed to retrieve logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/dailylogs/{id}:
    patch:
      tags: [DailyLog]
      summary: Update a daily log by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDailyLogRequest"
      responses:
        200:
          description: Log updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyLogResponse"
        400:
          description: Bad request or validation error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationErrorResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags: [DailyLog]
      summary: Delete a daily log by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Log deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyLogResponse"
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/profile:
    get:
      tags: [Profile]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        200:
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        400:
          description: Failed to get profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags: [Profile]
      summary: Create current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileRequest"
      responses:
        201:
          description: Profile created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        400:
          description: Bad request or validation error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationErrorResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      tags: [Profile]
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        200:
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        400:
          description: Bad request or validation error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationErrorResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [fullName, email, password]
      properties:
        fullName:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 6
          example: password123

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 6
          example: password123

    AuthUser:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: user@example.com
        role:
          type: string
          enum: [ADMIN, USER]
          example: USER

    AuthTokenData:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: "#/components/schemas/AuthUser"

    AuthTokenResponse:
      type: object
      properties:
        message:
          type: string
          example: Login successful
        data:
          $ref: "#/components/schemas/AuthTokenData"

    MeResponse:
      type: object
      properties:
        message:
          type: string
          example: User info fetched successfully
        data:
          $ref: "#/components/schemas/AuthUser"

    FoodUpsertRequest:
      type: object
      required: [name, calories, protein, carbs, fat, sugar, natrium]
      properties:
        name:
          type: string
          example: Apple
        calories:
          type: number
          nullable: true
          example: 52
        protein:
          type: number
          nullable: true
          example: 0.3
        carbs:
          type: number
          nullable: true
          example: 14
        fat:
          type: number
          nullable: true
          example: 0.2
        sugar:
          type: number
          nullable: true
          example: 10
        natrium:
          type: number
          nullable: true
          example: 1

    Food:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Apple
        calories:
          type: number
          nullable: true
          example: 52
        protein:
          type: number
          nullable: true
          example: 0.3
        carbs:
          type: number
          nullable: true
          example: 14
        fat:
          type: number
          nullable: true
          example: 0.2
        sugar:
          type: number
          nullable: true
          example: 10
        natrium:
          type: number
          nullable: true
          example: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FoodResponse:
      type: object
      properties:
        message:
          type: string
          example: Food created successfully
        data:
          $ref: "#/components/schemas/Food"

    FoodListResponse:
      type: object
      properties:
        message:
          type: string
          example: Foods retrieved successfully
        data:
          type: array
          items:
            $ref: "#/components/schemas/Food"

    CreateDailyLogRequest:
      type: object
      required: [foodId, date, mealTime, consumtionGram, totalCalories]
      properties:
        foodId:
          type: integer
          example: 1
        date:
          type: string
          format: date-time
          example: 2026-06-05T00:00:00Z
        mealTime:
          type: string
          enum: [BREAKFAST, LUNCH, DINNER, SNACK]
          example: BREAKFAST
        consumtionGram:
          type: number
          example: 100
        totalCalories:
          type: number
          example: 52
        totalProtein:
          type: number
          nullable: true
          example: 0.3
        totalCarbs:
          type: number
          nullable: true
          example: 14
        totalFat:
          type: number
          nullable: true
          example: 0.2
        totalSugar:
          type: number
          nullable: true
          example: 10
        totalNatrium:
          type: number
          nullable: true
          example: 1

    DailyLog:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
          example: 1
        foodId:
          type: integer
          example: 1
        date:
          type: string
          format: date-time
        mealTime:
          type: string
          enum: [BREAKFAST, LUNCH, DINNER, SNACK]
          example: BREAKFAST
        consumtionGram:
          type: number
          example: 100
        totalCalories:
          type: number
          example: 52
        totalProtein:
          type: number
          nullable: true
          example: 0.3
        totalCarbs:
          type: number
          nullable: true
          example: 14
        totalFat:
          type: number
          nullable: true
          example: 0.2
        totalSugar:
          type: number
          nullable: true
          example: 10
        totalNatrium:
          type: number
          nullable: true
          example: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DailyLogFood:
      type: object
      properties:
        name:
          type: string
          example: Apple

    DailyLogWithFood:
      allOf:
        - $ref: "#/components/schemas/DailyLog"
        - type: object
          properties:
            food:
              $ref: "#/components/schemas/DailyLogFood"

    DailyLogResponse:
      type: object
      properties:
        message:
          type: string
          example: Log created successfully
        data:
          $ref: "#/components/schemas/DailyLog"

    UpdateDailyLogRequest:
      type: object
      required:
        [consumtionGram, totalCalories, totalProtein, totalCarbs, totalFat]
      properties:
        consumtionGram:
          type: number
          example: 150
        totalCalories:
          type: number
          example: 78
        totalProtein:
          type: number
          example: 0.45
        totalCarbs:
          type: number
          example: 21
        totalFat:
          type: number
          example: 0.3

    DailyLogListResponse:
      type: object
      properties:
        message:
          type: string
          example: Logs retrieved successfully
        data:
          type: array
          items:
            $ref: "#/components/schemas/DailyLogWithFood"

    CreateProfileRequest:
      type: object
      required: [age, height, weight, gender, activityLevel, goal, weightGoal]
      properties:
        age:
          type: integer
          minimum: 1
          example: 25
        height:
          type: number
          minimum: 1
          example: 170
        weight:
          type: number
          minimum: 1
          example: 65
        gender:
          type: string
          enum: [MALE, FEMALE]
          example: MALE
        activityLevel:
          type: string
          enum: [SEDENTARY, MODERATE, VERY_ACTIVE]
          example: MODERATE
        goal:
          type: string
          enum: [BULKING, CUTTING, MAINTAINING]
          example: MAINTAINING
        weightGoal:
          type: number
          minimum: 1
          example: 62

    UpdateProfileRequest:
      type: object
      properties:
        age:
          type: integer
          minimum: 1
          example: 26
        height:
          type: number
          minimum: 1
          example: 171
        weight:
          type: number
          minimum: 1
          example: 64
        gender:
          type: string
          enum: [MALE, FEMALE]
          example: FEMALE
        activityLevel:
          type: string
          enum: [SEDENTARY, MODERATE, VERY_ACTIVE]
          example: VERY_ACTIVE
        goal:
          type: string
          enum: [BULKING, CUTTING, MAINTAINING]
          example: BULKING
        weightGoal:
          type: number
          minimum: 1
          example: 62

    Profile:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
          example: 1
        gender:
          type: string
          enum: [MALE, FEMALE]
          example: MALE
        age:
          type: integer
          example: 25
        weight:
          type: number
          example: 65
        height:
          type: number
          example: 170
        activityLevel:
          type: string
          enum: [SEDENTARY, MODERATE, VERY_ACTIVE]
          example: MODERATE
        goal:
          type: string
          enum: [BULKING, CUTTING, MAINTAINING]
          example: MAINTAINING
        weightGoal:
          type: number
          nullable: true
          example: 62
        calorieGoal:
          type: number
          nullable: true
          example: 2100
        proteinGoal:
          type: number
          nullable: true
          example: 120
        carbGoal:
          type: number
          nullable: true
          example: 250
        fatGoal:
          type: number
          nullable: true
          example: 60
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProfileResponse:
      type: object
      properties:
        message:
          type: string
          example: Profile retrieved successfully
        data:
          $ref: "#/components/schemas/Profile"

    ValidationErrorItem:
      type: object
      properties:
        field:
          type: string
          example: email
        message:
          type: string
          example: Invalid email address

    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Validation failed
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationErrorItem"

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Bad request
        data:
          nullable: true
          example: null
