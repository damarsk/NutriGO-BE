openapi: 3.0.0
info:
  title: NutriGO API
  version: 1.0.0
  description: NutriGO API Documentation

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://api-nutrigo.vercel.app
    description: Production server

tags:
  - name: Auth
  - name: Food

paths:
  # ================= AUTH =================

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        201:
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        400:
          description: Bad request

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        200:
          description: User logged in successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        400:
          description: Bad request

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user information
      security:
        - bearerAuth: []
      responses:
        200:
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        401:
          description: Unauthorized

  # ================= FOOD =================

  /api/foods:
    get:
      tags: [Food]
      summary: Get all foods
      security:
        - bearerAuth: []
      responses:
        200:
          description: Foods retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodListResponse"
        401:
          description: Unauthorized

    post:
      tags: [Food]
      summary: Create a new food
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFoodRequest"
      responses:
        201:
          description: Food created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoodResponse"
        400:
          description: Bad request
        401:
          description: Unauthorized

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 6
          example: password123

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 6
          example: password123

    AuthResponse:
      type: object
      properties:
        message:
          type: string
          example: "User registered successfully"
        data:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
            token:
              type: string

    CreateFoodRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: "Apple"
        calories:
          type: number
          nullable: true
          example: 52
        carbs:
          type: number
          nullable: true
          example: 14
        fat:
          type: number
          nullable: true
          example: 0.2
        sugar:
          type: number
          nullable: true
          example: 10
        natrium:
          type: number
          nullable: true
          example: 1

    Food:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        calories:
          type: number
          nullable: true
        carbs:
          type: number
          nullable: true
        fat:
          type: number
          nullable: true
        sugar:
          type: number
          nullable: true
        natrium:
          type: number
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FoodResponse:
      type: object
      properties:
        message:
          type: string
          example: "Food created successfully"
        data:
          $ref: "#/components/schemas/Food"

    FoodListResponse:
      type: object
      properties:
        message:
          type: string
          example: "Foods retrieved successfully"
        data:
          type: array
          items:
            $ref: "#/components/schemas/Food"
